name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:54321' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'local-dev-anon-key' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:ci
      - name: Report web test coverage
        run: npm run test:coverage -w apps/web

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate migration files
        run: npm run validate:migrations

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Browser fixtures do not cover every server-side catalog request.
      # Keep local Supabase available for SQL parity and unmocked metadata APIs.
      - name: Start local Supabase
        run: supabase start
      - name: Verify shared SQL scoring on a transactional fixture catalog
        run: npm run validate:scoring:local
      - name: Seed the platform row used by catalog metadata
        run: |
          supabase db query --local "
            insert into games_library.platforms (id, name, family, vendor, kind, gen)
            values ('switch_2', 'Nintendo Switch 2', 'nintendo', 'nintendo', 'hybrid', 9)
            on conflict (id) do nothing;
          "
      - name: Run Chromium browser checks
        run: npm run test:e2e -w apps/web -- --project=chromium
